name: CI

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  pull_request:

jobs:
  test-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27.1'

      - name: Setup msys2 toolchain
        id: msys2
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            git
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-make

      - name: Build RocksDB static library
        shell: msys2 {0}
        run: |
          git clone --depth 1 --branch v11.8.1 https://github.com/facebook/rocksdb.git C:/rocksdb-src
          cmake -S C:/rocksdb-src -B C:/rocksdb-build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_STANDARD=20 \
            -DCMAKE_CXX_FLAGS="-Wno-error=maybe-uninitialized" \
            -DROCKSDB_BUILD_SHARED=OFF -DWITH_TESTS=OFF -DWITH_TOOLS=OFF \
            -DWITH_BENCHMARK_TOOLS=OFF -DWITH_JNI=OFF \
            -DWITH_GFLAGS=OFF -DWITH_ZLIB=OFF -DWITH_LZ4=OFF \
            -DWITH_SNAPPY=OFF -DWITH_ZSTD=OFF -DWITH_BZ2=OFF
          cmake --build C:/rocksdb-build -j2

      - name: Build
        shell: pwsh
        run: |
          # 动态探测 MSYS2 UCRT64 实际安装位置（setup-msys2 输出不可靠时按候选路径兜底）
          $candidates = @()
          if ("${{ steps.msys2.outputs.msys2-location }}" -ne "") { $candidates += "${{ steps.msys2.outputs.msys2-location }}" }
          if ($env:MINGW_PREFIX) { $candidates += $env:MINGW_PREFIX }
          $candidates += "C:/msys64/msys64", "C:/msys64", "D:/a/_temp/setup-msys2"
          $env:MSYS2_ROOT = $null
          foreach ($c in $candidates) {
            if (Test-Path "$c/ucrt64/bin/g++.exe") { $env:MSYS2_ROOT = $c; break }
          }
          if (-not $env:MSYS2_ROOT) { Write-Error "MSYS2 UCRT64 g++ not found (searched: $($candidates -join ', '))"; exit 1 }
          Write-Host "MSYS2 location: $env:MSYS2_ROOT"
          $env:CC = "$env:MSYS2_ROOT/ucrt64/bin/gcc.exe"
          $env:CXX = "$env:MSYS2_ROOT/ucrt64/bin/g++.exe"
          if (-not (Test-Path $env:CXX)) { Write-Error "MSYS2 UCRT64 g++ not found: $env:CXX"; exit 1 }
          & $env:CC --version | Select-Object -First 1
          go version
          $env:CGO_CFLAGS = "-IC:/rocksdb-src/include"
          $env:CGO_CXXFLAGS = "-IC:/rocksdb-src/include"
          $env:CGO_LDFLAGS = "-LC:/rocksdb-build -L$env:MSYS2_ROOT/ucrt64/lib -lrocksdb -lshlwapi -lrpcrt4 -lws2_32 -lstdc++ -lwinpthread -static"
          go env CC CXX CGO_CFLAGS CGO_CXXFLAGS CGO_LDFLAGS
          Get-ChildItem "$env:MSYS2_ROOT/ucrt64/lib" -Filter "libstdc++*" | Select-Object Name
          go build -x ./cmd/openxdb 2>&1
          if ($LASTEXITCODE -eq 0) { go build ./... } else { exit $LASTEXITCODE }

      - name: Test
        shell: pwsh
        run: |
          # 动态探测 MSYS2 UCRT64 实际安装位置（setup-msys2 输出不可靠时按候选路径兜底）
          $candidates = @()
          if ("${{ steps.msys2.outputs.msys2-location }}" -ne "") { $candidates += "${{ steps.msys2.outputs.msys2-location }}" }
          if ($env:MINGW_PREFIX) { $candidates += $env:MINGW_PREFIX }
          $candidates += "C:/msys64/msys64", "C:/msys64", "D:/a/_temp/setup-msys2"
          $env:MSYS2_ROOT = $null
          foreach ($c in $candidates) {
            if (Test-Path "$c/ucrt64/bin/g++.exe") { $env:MSYS2_ROOT = $c; break }
          }
          if (-not $env:MSYS2_ROOT) { Write-Error "MSYS2 UCRT64 g++ not found (searched: $($candidates -join ', '))"; exit 1 }
          Write-Host "MSYS2 location: $env:MSYS2_ROOT"
          $env:CC = "$env:MSYS2_ROOT/ucrt64/bin/gcc.exe"
          $env:CXX = "$env:MSYS2_ROOT/ucrt64/bin/g++.exe"
          $env:CGO_CFLAGS = "-IC:/rocksdb-src/include"
          $env:CGO_CXXFLAGS = "-IC:/rocksdb-src/include"
          $env:CGO_LDFLAGS = "-LC:/rocksdb-build -L$env:MSYS2_ROOT/ucrt64/lib -lrocksdb -lshlwapi -lrpcrt4 -lws2_32 -lstdc++ -lwinpthread -static"
          go test ./...

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27.1'

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential cmake ninja-build git

      - name: Build RocksDB static library
        run: |
          git clone --depth 1 --branch v11.8.1 https://github.com/facebook/rocksdb.git /tmp/rocksdb-src
          cmake -S /tmp/rocksdb-src -B /tmp/rocksdb-build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_STANDARD=20 \
            -DCMAKE_CXX_FLAGS="-Wno-error=maybe-uninitialized" \
            -DROCKSDB_BUILD_SHARED=OFF -DWITH_TESTS=OFF -DWITH_TOOLS=OFF \
            -DWITH_BENCHMARK_TOOLS=OFF -DWITH_JNI=OFF \
            -DWITH_GFLAGS=OFF -DWITH_ZLIB=OFF -DWITH_LZ4=OFF \
            -DWITH_SNAPPY=OFF -DWITH_ZSTD=OFF -DWITH_BZ2=OFF
          cmake --build /tmp/rocksdb-build -j$(nproc)

      - name: Build
        env:
          CGO_ENABLED: '1'
          CGO_CFLAGS: '-I/tmp/rocksdb-src/include'
          CGO_CXXFLAGS: '-I/tmp/rocksdb-src/include'
          CGO_LDFLAGS: '-L/tmp/rocksdb-build -lrocksdb'
        run: |
          go version
          go build -x ./cmd/openxdb
          go build ./...

      - name: Test
        env:
          CGO_ENABLED: '1'
          CGO_CFLAGS: '-I/tmp/rocksdb-src/include'
          CGO_CXXFLAGS: '-I/tmp/rocksdb-src/include'
          CGO_LDFLAGS: '-L/tmp/rocksdb-build -lrocksdb'
        run: |
          go test ./...

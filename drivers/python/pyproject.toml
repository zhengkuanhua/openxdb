[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "openxdb"
version = "0.10.0"
description = "Python driver for OpenXDB (native TCP line protocol)"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [{ name = "OpenXDB" }]
keywords = ["openxdb", "database", "driver"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Topic :: Database",
]

[project.optional-dependencies]
test = ["pytest>=7.0"]

[tool.setuptools.packages.find]
include = ["openxdb*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
